# Once a day, saves release download totals and GitHub's daily views and
# clones as CSV on the `stats` branch, then draws the card, the charts, a
# badge per module and a README there (tools/stats/cli.ts). The main README
# shows the card; the package READMEs show their badges. GitHub keeps only
# running totals and 14 days of traffic; this keeps the history.
# Traffic needs the STATS_TOKEN secret (docs/RELEASING.md, Download counts);
# without it only downloads are saved. Referrers are not saved: they name
# people's own Foundry servers, and this branch is public.
# The scripts import no npm packages, so there is no install step.
name: Download counts

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats

jobs:
  snapshot:
    # Run by hand from another branch, it would publish that branch's code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check out the stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats > /dev/null; then
            git fetch --depth 1 origin stats:stats
            git worktree add ../stats stats
          else
            git worktree add --orphan -b stats ../stats
          fi
      - name: Take today's snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node tools/stats/cli.ts snapshot ../stats
      - name: Draw the charts and badges
        run: node tools/stats/cli.ts render ../stats
      - name: Save it on the stats branch
        run: |
          cd ../stats
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "stats $(date -u +%F)"
          # The checkout's credentials belong to the main working tree, which
          # shares the stats branch with this worktree.
          git -C "$GITHUB_WORKSPACE" push origin stats
